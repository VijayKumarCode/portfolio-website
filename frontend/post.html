<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Engineering log post by Vijay Kumar." id="post-meta-desc" />
  <meta name="robots" content="index, follow" />
  <title>Engineering Log | Vijay Kumar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/blog.css" />
  <link rel="stylesheet" href="/css/mediaqueries.css" />
</head>
<body>

 <header id="site-header">
  <nav id="blog-nav" aria-label="Blog navigation">
    <a href="/" class="logo-container" aria-label="Vijay Kumar — Home">
      <img src="assets/logo.png" alt="Vijay Kumar" class="logo-img" width="48" height="48">
    </a>
    <div class="blog-nav-right">
      <a href="/blog" class="nav-back">← Back to Engineering Log</a>
    </div>
  </nav>
</header>
  
  <main id="main-content" class="post-page">

    <!-- Loading state -->
    <div id="post-loading" class="blog-state blog-state--loading" aria-label="Loading post">
      <div class="skeleton-card skeleton-card--post"></div>
    </div>

    <!-- Post container — hidden by default -->
    <article id="post-container" class="post hidden" aria-labelledby="post-title">

      <header class="post__header">
        <div class="post__meta" id="post-meta">
          <span id="post-category" class="post__category"></span>
          <span id="post-date"     class="post__date"></span>
          <span id="post-read-time" class="post__read-time"></span>
        </div>
        <h1 id="post-title" class="post__title"></h1>
        <div id="post-tags" class="post__tags"></div>
      </header>

      <div id="post-body" class="post__body prose"></div>

      <footer class="post__footer">
        <a href="/blog" class="btn btn--outline">← Back to Log</a>
      </footer>

    </article>

    <!-- Not found state — hidden by default -->
    <div id="post-not-found" class="blog-state blog-state--empty hidden" role="status">
      <span class="blog-state__icon" aria-hidden="true">🔍</span>
      <h1 class="blog-state__title">Post Not Found</h1>
      <p class="blog-state__body">This entry doesn't exist or has been moved.</p>
      <a href="/blog" class="btn btn--outline">← Back to Log</a>
    </div>

    <!-- Error state — hidden by default -->
    <div id="post-error" class="blog-state blog-state--error hidden" role="alert">
      <span class="blog-state__icon" aria-hidden="true">⚡</span>
      <h2 class="blog-state__title">Failed to Load Post</h2>
      <p class="blog-state__body">The post is temporarily unavailable.</p>
      <button id="post-retry" class="blog-state__retry">Retry</button>
    </div>

  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__copy">© 2026 Vijay Kumar</span>
      <nav class="footer__links" aria-label="Footer links">
        <a href="/" class="footer__link">Portfolio</a>
        <a href="https://github.com/VijayKumarCode" class="footer__link" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="/js/post.js"></script>

</body>
</html>
