<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    FIX PRIME BUG: <base href="/"> forces ALL relative paths to resolve
    from the domain root, regardless of the current URL path.

    Without this, when Vercel serves post.html for /blog/slug,
    the browser resolves relative paths under /blog/:
      css/style.css  → /blog/css/style.css  → 404 (page unstyled)
      assets/logo.png → /blog/assets/logo.png → 404

    With <base href="/">, they resolve correctly:
      css/style.css  → /css/style.css  ✓
      assets/logo.png → /assets/logo.png ✓
  -->
  <base href="/">

  <title>Loading… | Engineering Log</title>
  <meta name="description" content="Engineering Log | Vijay Kumar">
  <link rel="icon" type="image/png" href="assets/profilePic.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
</head>

<body class="single-post-page">

  <header id="site-header" role="banner">
    <nav id="blog-nav" aria-label="Post navigation">
      <a href="/" class="logo-container" aria-label="Back to portfolio">
        <img src="assets/logo.png" alt="Vijay Kumar" class="logo-img">
      </a>
      <div class="blog-nav-right">
        <a href="/blog" class="nav-back">← All entries</a>
      </div>
    </nav>
  </header>

  <main>
    <article class="post-wrap" id="post-article">

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol role="list">
          <li><a href="/blog">Engineering Log</a></li>
          <li aria-hidden="true">/</li>
          <li id="breadcrumb-title" aria-current="page">Loading…</li>
        </ol>
      </nav>

      <header class="post-header">
        <span class="category-tag" id="post-category"></span>
        <h1 class="post-title" id="post-title"></h1>
        <div class="post-meta" aria-label="Post metadata">
          <span class="post-meta-author">
            <img src="assets/profilePic.png" alt="" class="post-avatar" aria-hidden="true">
            Vijay Kumar
          </span>
          <span class="post-meta-sep" aria-hidden="true">·</span>
          <time id="post-date"></time>
          <span class="post-meta-sep" aria-hidden="true">·</span>
          <span id="post-read-time"></span>
        </div>
      </header>

      <div class="post-divider" aria-hidden="true"></div>
      <div class="post-content" id="post-content" role="main"></div>
      <div class="post-divider" aria-hidden="true"></div>

      <nav class="post-navigation" id="post-navigation" aria-label="Navigate between posts"></nav>

      <aside class="author-box" aria-label="About the author">
        <div class="author-box-inner">
          <img src="assets/profilePic.png"
               alt="Vijay Kumar"
               class="author-avatar"
               width="52" height="52">
          <div class="author-info">
            <p class="author-name">Vijay Kumar</p>
            <p class="author-bio">
              Backend engineer building real-time systems with Java 17 and Spring Boot 3.
              Currently shipping <a href="https://nexusgame.space" target="_blank" rel="noopener">Nexus</a>
              and writing about the problems I run into.
            </p>
            <div class="author-links">
              <a href="https://github.com/VijayKumarCode" target="_blank" rel="noopener">GitHub</a>
              <a href="https://linkedin.com/in/vijaykumarcode" target="_blank" rel="noopener">LinkedIn</a>
            </div>
          </div>
        </div>
      </aside>

    </article>
  </main>

  <footer class="blog-footer" role="contentinfo">
    <div class="blog-footer-inner">
      <p class="footer-copy">© 2026 Vijay Kumar</p>
      <nav aria-label="Footer links">
        <ul role="list">
          <li><a href="/">Portfolio</a></li>
          <li><a href="/blog">All entries</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <!-- FIX: Removed stray "git" text that was rendered as visible content.
       Script uses absolute path — not affected by <base href="/"> -->
  <script type="module" src="/js/post.js"></script>

</body>
</html>
