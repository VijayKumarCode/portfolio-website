<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blog articles by Vijay Kumar on backend engineering, Node.js, PostgreSQL, Docker, and system design." />
  <meta name="author" content="Vijay Kumar" />
  <meta property="og:title" content="Blog | Vijay Kumar" />
  <meta property="og:description" content="Backend engineering articles on Node.js, PostgreSQL, Docker, and scalable systems." />
  <meta property="og:type" content="website" />

  <title>Blog | Vijay Kumar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mediaqueries.css" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
</head>
<body>
  <!-- NAVIGATION -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container navbar__inner">
      <a href="/" class="navbar__logo" aria-label="Vijay Kumar — Home">
        Vijay Kumar
      </a>
      <button
        class="hamburger"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="nav-menu"
        type="button"
      >
        <span class="hamburger__line"></span>
        <span class="hamburger__line"></span>
        <span class="hamburger__line"></span>
      </button>
      <ul class="nav-menu" id="nav-menu" role="list">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/#about" class="nav-link">About</a></li>
        <li><a href="/#projects" class="nav-link">Projects</a></li>
        <li><a href="/blog.html" class="nav-link" aria-current="page">Blog</a></li>
        <li><a href="/#contact" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main id="main-content">
    <section class="blog-page section" aria-labelledby="blog-page-heading">
      <div class="container">
        <div class="blog-page__header">
          <p class="section__label">All Articles</p>
          <h1 id="blog-page-heading" class="section__title">Blog</h1>
          <p class="blog-page__subtitle">
            Technical writing on backend engineering, system design, databases,
            and developer tooling.
          </p>
          <p class="blog-page__count" id="blog-post-count" aria-live="polite"></p>
        </div>

        <!-- Blog list rendered by blog.js -->
        <div
          id="blog-list-container"
          class="blog-list"
          aria-label="All blog posts"
          aria-live="polite"
        ></div>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container footer__inner">
      <p class="footer__copy">
        &copy; <span id="footer-year"></span> Vijay Kumar. Designed and built with care.
      </p>
      <nav class="footer__nav" aria-label="Footer navigation">
        <a href="/" class="footer__link">Home</a>
        <a href="/blog.html" class="footer__link">Blog</a>
        <a href="/#contact" class="footer__link">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="blogManager.js" defer></script>
  <script src="blog.js" defer></script>
  <script src="script.js" defer></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
