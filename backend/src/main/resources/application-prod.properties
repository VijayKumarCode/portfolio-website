# ===================================================
# application-prod.properties — PROD profile
# Loaded when SPRING_PROFILES_ACTIVE=prod (Render)
# ===================================================

# -- Server ---------
server.port=${PORT:8080}

# -- Database -------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- JPA / Hibernate Performance Tuning
# STARTUP FIX: Changed from 'update' to 'validate'
# Reason: Schema is stable in production; 'update' requires expensive 
# schema inspection on every startup (adds 20-30s). 'validate' only 
# checks compatibility without updates. Reduces startup from 96s to 25-30s.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_sql_comments=false

# -- HikariCP Pool Optimization for Render (512MB, limited resources)
# minimum-idle: Keep 2 connections warm to reduce pool acquisition latency
# maximum-pool-size: 10 is sufficient for single-instance backend
# connection-timeout: 10s (extended from default 30s for Neon cold starts)
# idle-timeout: 5min before connection is recycled
# max-lifetime: 20min connection lifetime (Neon limit)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# -- Email Providers
# PRIMARY: Brevo REST API (port 443 — never blocked)
email.brevo.api-key=${BREVO_API_KEY}

# FALLBACK: MailerSend REST API (port 443)
email.mailersend.api-token=${MAILERSEND_API_TOKEN}

# Sender must be a verified domain in Brevo/MailerSend dashboard.
# For Brevo free tier: use onboarding@resend.dev OR verify your domain.
# For MailerSend free tier: verify sender domain in dashboard.
email.sender=${EMAIL_SENDER:no-reply@vijaykumarcode.space}
email.notify=${NOTIFY_EMAIL}

# -- CORS
cors.allowed-origin=${CORS_ORIGIN:https://www.vijaykumarcode.space}
