# ============================================================================
# PRODUCTION METRIC OVERRIDES (application-prod.properties)
# ============================================================================
# This file profiles performance optimizations tailored for production execution.
# ============================================================================

# ── Neon Compute Waking Protection ─────────────────────────────────────────
# Prevents backend from crashing on boot if serverless DB takes time to spin up
spring.datasource.hikari.initialization-fail-timeout=0

# ── Production Graceful Web Shutdown ────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ── High-Efficiency Logging Matrix ──────────────────────────────────────────
# Drops root overhead framework logs to minimize memory usage
logging.level.root=WARN
logging.level.com.vijaykumar=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=WARN