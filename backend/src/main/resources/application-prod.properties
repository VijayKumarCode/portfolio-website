# ============================================================================
# PRODUCTION OVERRIDES (application-prod.properties)
# ============================================================================
# This file is activated by SPRING_PROFILES_ACTIVE=prod on Render.
# Contains ONLY overrides from application.properties.
# ============================================================================

# ----------------------------
# HIBERNATE — DISABLE ALL NON-ESSENTIAL STARTUP WORK
# ----------------------------
# Schema validation already disabled in base, ensure prod doesn't override
spring.jpa.hibernate.ddl-auto=none
# Disable Open-in-View (anti-pattern, adds overhead)
spring.jpa.open-in-view=false

# ----------------------------
# LOGGING — PRODUCTION ONLY
# ----------------------------
# Minimal logging for cost and performance
logging.level.root=WARN
logging.level.com.vijaykumar=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.connections=ERROR
logging.level.com.zaxxer.hikari=WARN

# ----------------------------
# RENDER-SPECIFIC: INSTANCE WAKEUP OPTIMIZATION
# ----------------------------
# Render free tier sleeps after 15 min inactivity.
# These settings help the instance wake faster.

# Pre-warm the connection pool on startup
spring.datasource.hikari.initialization-fail-timeout=10000

# ----------------------------
# JVM OPTIMIZATION FOR RENDER 512MB
# ----------------------------
# These are set via Render's JAVA_OPTS environment variable:
# JAVA_OPTS=-Xmx300m -Xms150m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
# -Xmx300m = max 300MB heap (leaves room for off-heap + native)
# -Xms150m = initial 150MB (reduces resizing overhead)
# -UseG1GC = garbage collector optimized for low pause
# -MaxGCPauseMillis=200 = target 200ms max GC pause

# ----------------------------
# EMAIL: PRODUCTION RECIPIENT
# ----------------------------
# Ensure production sends to YOUR email, not a test address
email.recipient.address=${EMAIL_RECIPIENT:vkumar.kumar31@gmail.com}
app.notify-email=${email.recipient.address}

# ----------------------------
# RENDER HEALTH CHECK OPTIMIZATION
# ----------------------------
# Render health checks start only after Spring signals "started"
# Graceful shutdown gives in-flight requests time to complete
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s