# ═══════════════════════════════════════════════════════
# application-prod.properties — PROD profile
# Loaded when SPRING_PROFILES_ACTIVE=prod (Render)
# ═══════════════════════════════════════════════════════

# ── Server ───────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── Email Providers ──────────────────────────────────
# PRIMARY: Brevo REST API (port 443 — never blocked)
email.brevo.api-key=${BREVO_API_KEY}

# FALLBACK: MailerSend REST API (port 443)
email.mailersend.api-token=${MAILERSEND_API_TOKEN}

# Sender must be a verified domain in Brevo/MailerSend dashboard.
# For Brevo free tier: use onboarding@resend.dev OR verify your domain.
# For MailerSend free tier: verify sender domain in dashboard.
email.sender=${EMAIL_SENDER:onboarding@resend.dev}
email.notify=${NOTIFY_EMAIL}

# ── CORS ─────────────────────────────────────────────
cors.allowed-origin=${CORS_ORIGIN:https://vijaykumarcode.space}