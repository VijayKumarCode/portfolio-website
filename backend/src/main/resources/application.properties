# ===================================================
# application.properties — DEFAULT (local dev) profile
# Loaded when SPRING_PROFILES_ACTIVE is not set.
# ===================================================

# -- Server
server.port=${PORT:8080}

# -- Database (local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- JPA
# Local dev: use 'update' to auto-create/update schema
# Production: use 'validate' (see application-prod.properties)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# -- Email Providers
# PRIMARY: Brevo REST API
email.brevo.api-key=${BREVO_API_KEY:}

# FALLBACK: MailerSend REST API
email.mailersend.api-token=${MAILERSEND_API_TOKEN:}

# Shared sender / recipient config
email.sender=${EMAIL_SENDER:no-reply@vijaykumarcode.space}
email.notify=${NOTIFY_EMAIL:vkumar.kumar31@gmail.com}

# -- CORS
cors.allowed-origin=${CORS_ORIGIN:http://localhost:5500}
