# ============================================================================
# PORTFOLIO BACKEND — BASE BLUEPRINT (application.properties)
# ============================================================================
# This file contains base settings shared across all environments.
# Secrets and environment overrides are pulled via Render Dashboard panel.
# ============================================================================

# ── Application & Server ───────────────────────────────────────────────────
spring.application.name=portfolio-service
server.port=${PORT:8080}
server.compression.enabled=true

# ── Database Link Infrastructure (Neon PostgreSQL) ──────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Tuning (Optimized for Neon Serverless + Render Free Tier) ──────
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=PortfolioHikariPool

# ── JPA / Hibernate Metadata Engine (Startup Optimized) ─────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.bytecode.provider=none
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.enhancer.enable=false
spring.jpa.open-in-view=false

# ── Core Framework Diagnostics (Local/Dev Baseline) ────────────────────────
logging.level.com.vijaykumar=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.com.zaxxer.hikari=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} — %msg%n

# ── Cross-Origin Resource Sharing (CORS) ───────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Primary & Fallback Email Api Routes ────────────────────────────────────
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=https://api.brevo.com/v3/smtp/email
mailersend.api.key=${MAILERSEND_API_KEY:}
mailersend.api.url=https://api.mailersend.com/v1/email

# ── System Email Metadata Mappings ──────────────────────────────────────────
email.sender.address=${EMAIL_SENDER:noreply@vijaykumarcode.space}
email.sender.name=${EMAIL_SENDER_NAME:Vijay Kumar Portfolio}
email.recipient.address=${EMAIL_RECIPIENT:vkumar.kumar31@gmail.com}

app.notify-email=${email.recipient.address}
app.mail-from-email=${email.sender.address}
app.mail-from-name=${email.sender.name}