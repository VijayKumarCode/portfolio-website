# ============================================================================
# PORTFOLIO BACKEND — CORE CONFIGURATION (application.properties)
# ============================================================================
# This file contains base settings shared across all environments.
# Production overrides are in application-prod.properties.
# ============================================================================

# ----------------------------
# APPLICATION
# ----------------------------
spring.application.name=portfolio-service
server.port=${PORT:8080}

# ----------------------------
# DATABASE — NEON POSTGRESQL
# ----------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — OPTIMIZED FOR SERVERLESS NEON + RENDER FREE TIER
# Critical: Small pool prevents Neon connection exhaustion and reduces cold-start
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
# Keepalive prevents Neon from suspending compute during active sessions
spring.datasource.hikari.keepalive-time=120000
# Register mbeans for monitoring
spring.datasource.hikari.register-mbeans=true
# Connection test query for Neon serverless
spring.datasource.hikari.connection-test-query=SELECT 1

# ----------------------------
# JPA / HIBERNATE — STARTUP OPTIMIZED
# ----------------------------
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# CRITICAL FIX: 'validate' compares schema on EVERY boot = 40-60s on Render CPU
# 'none' skips validation — schema is managed manually or at build time
# If you need validation, do it in CI/CD, not at runtime
spring.jpa.hibernate.ddl-auto=none
# Disable Hibernate's second-level cache (not needed for simple CRUD)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# Disable bytecode provider (reduces startup time)
spring.jpa.properties.hibernate.bytecode.provider=none
# Batch size for inserts (if you ever do bulk operations)
spring.jpa.properties.hibernate.jdbc.batch_size=20
# Format SQL for debugging (disable in prod if desired)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# CRITICAL FIX: Disable Hibernate's expensive entity enhancement
spring.jpa.properties.hibernate.enhancer.enable=false

# ----------------------------
# LOGGING — PRODUCTION SAFE
# ----------------------------
# Log level: INFO for app, WARN for framework noise
logging.level.com.vijaykumar=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
# CRITICAL: Suppress the noisy connection pool logs that show "undefined"
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.com.zaxxer.hikari=INFO
# Log pattern with timestamp and level only
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} — %msg%n

# ----------------------------
# EMAIL PROVIDER API KEYS (from environment)
# ----------------------------
# These are injected by Render environment variables
# FIX: Keys are trimmed in service code to prevent newline corruption
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=https://api.brevo.com/v3/smtp/email
mailersend.api.key=${MAILERSEND_API_KEY:}
mailersend.api.url=https://api.mailersend.com/v1/email

# ----------------------------
# SENDER CONFIGURATION
# ----------------------------
email.sender.address=${EMAIL_SENDER:noreply@vijaykumarcode.space}
email.sender.name=${EMAIL_SENDER_NAME:Vijay Kumar Portfolio}
email.recipient.address=${EMAIL_RECIPIENT:vkumar.kumar31@gmail.com}
app.notify-email=${email.recipient.address}
app.mail-from-email=${email.sender.address}
app.mail-from-name=${email.sender.name}

# ----------------------------
# REST TEMPLATE — TIMEOUTS
# ----------------------------
# Timeout for external API calls (email providers)
rest.template.connect-timeout=5000
rest.template.read-timeout=10000

# ----------------------------
# SERVER — COMPRESSION + TIMEOUTS
# ----------------------------
server.compression.enabled=true
server.shutdown=graceful

# ----------------------------
# MANAGEMENT / ACTUATOR
# ----------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
