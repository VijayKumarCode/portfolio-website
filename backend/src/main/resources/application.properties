# ═══════════════════════════════════════════════════════
# application.properties — DEFAULT (local dev) profile
# Loaded when SPRING_PROFILES_ACTIVE is not set.
# ═══════════════════════════════════════════════════════

# ── Server ───────────────────────────────────────────
server.port=${PORT:8080}

# ── Database (local PostgreSQL) ──────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:*Vijay1990}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ── Email (local dev — email is attempted but will fail
#    gracefully; message is always saved to DB first) ──
# BUG FIX: These keys MUST exist in the default profile.
# Without them Spring crashes at startup when no profile
# is active. Defaults here prevent the crash locally.
RESEND_API_KEY=${RESEND_API_KEY:re_dummy_local_key}
app.notify-email=${NOTIFY_EMAIL:vkumar.kumar31@gmail.com}
app.mail-from=${MAIL_FROM:onboarding@resend.dev}

# ── CORS ─────────────────────────────────────────────
cors.allowed-origin=${CORS_ORIGIN:http://localhost:5500}