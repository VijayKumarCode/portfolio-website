# ═══════════════════════════════════════════════════════
# application-prod.properties — PROD profile
# Loaded when SPRING_PROFILES_ACTIVE=prod (Render)
# ═══════════════════════════════════════════════════════

# ── Server ───────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Hibernate 6 auto-detects dialect — explicit setting removed

# ── Email ────────────────────────────────────────────
# BUG FIX: Resend free tier allows ONE verified domain.
# nexusgame.space is already used for the game backend.
# vijaykumarcode.space CANNOT be the FROM address on
# the free plan without adding a second domain.
#
# Solution: use onboarding@resend.dev — Resend's shared
# address available on the free tier. No domain needed.
# Emails arrive from "onboarding@resend.dev" but the
# subject says "Portfolio contact from [name]" so you
# still know it's from your portfolio form.
app.mail-from=onboarding@resend.dev
app.notify-email=${NOTIFY_EMAIL}

# ── CORS ─────────────────────────────────────────────
cors.allowed-origin=${CORS_ORIGIN:https://vijaykumarcode.space}